ranslateY(-14px) scale(.94)}}@keyframes badgePop{from{transform:scale(0) rotate(-200deg)}to{transform:none}}@keyframes hlBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}.hl{position:fixed;border:3px solid #ffd23f;border-radius:14px;pointer-events:none;transition:left .45s var(--spring),top .45s var(--spring),width .45s,height .45s;animation:hlBoxIn .6s var(--spring) both,hlPulse 1.6s ease-in-out .6s infinite}.hl-num{position:absolute;top:-15px;left:-15px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff3b0,#ffd23f 60%,#c8801a);color:#000;border:2px solid #000;font-weight:900;font-size:1rem;display:grid;place-items:center;box-shadow:0 0 0 2px #fff,0 6px 0 #6e4a0a;animation:badgePop .6s .25s var(--spring) both}.hl-txt{position:fixed;border-radius:16px;overflow:hidden;background:#0a0e1a;color:#fff;border:2px solid #ffd23f;font-size:.98rem;line-height:1.5;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.7);pointer-events:none;animation:hlTipIn .55s .15s var(--spring) both}.hl-step{padding:10px 14px 0;font-size:.7rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);font-weight:800}.hl-body{padding:4px 14px 14px}.hl-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));transform-origin:left;animation:hlBar linear forwards}.leave .hl,.leave .hl-txt{animation:hlOut .38s ease-in forwards}.help-ctrl{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));z-index:4600;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(24px) scale(.9);pointer-events:none;transition:opacity .3s,transform .5s var(--spring)}.help-ctrl.show{opacity:1;transform:none;pointer-events:auto}.hc{border:1px solid rgba(52,231,228,.55);border-radius:14px;padding:11px 16px;font-size:.8rem;font-weight:800;letter-spacing:.4px;color:#eafffe;cursor:pointer;background:radial-gradient(circle at 30% 25%,rgba(52,231,228,.7),rgba(45,212,167,.25));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 5px 0 #0a5a4f,0 12px 20px rgba(0,0,0,.4);transition:transform .15s var(--spring)}.hc:active{transform:translateY(4px)}.hc-ghost{color:var(--text);border-color:rgba(255,255,255,.25);background:var(--glass);box-shadow:0 5px 0 rgba(0,0,0,.25),0 12px 20px rgba(0,0,0,.35)}.hc-count{font-size:.7rem;color:#c9d3e6;font-weight:700;min-width:36px;text-align:center;text-shadow:0 1px 4px #000}@keyframes hfIn{from{opacity:0;transform:translate(-50%,-50%) perspective(900px) rotateX(35deg) translateY(60px) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) perspective(900px) rotateX(0) translateY(0) scale(1)}}@keyframes hfChild{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes hfShim{from{background-position:220% 0}to{background-position:-220% 0}}.hf-card{position:fixed;left:50%;top:50%;width:min(88vw,360px);padding:20px 18px 18px;border-radius:22px;color:#f0f4ff;background:linear-gradient(160deg,rgba(30,40,66,.97),rgba(8,12,24,.97));border:2px solid #ffd23f;box-shadow:0 0 0 4px #000,0 0 0 8px rgba(255,210,63,.3),0 30px 60px rgba(0,0,0,.65);animation:hfIn .75s var(--spring) both}.hf-card>*{animation:hfChild .5s var(--spring) backwards}.hf-kicker{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-weight:800}.hf-title{font-size:1.2rem;margin:6px 0;font-weight:800}.hf-text{font-size:.85rem;line-height:1.5;color:#c9d3e6;margin-bottom:14px}.hf-img{width:100%;aspect-ratio:16/9;border-radius:14px;border:2px dashed rgba(255,210,63,.7);display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(110deg,rgba(255,255,255,.03) 30%,rgba(255,210,63,.2) 50%,rgba(255,255,255,.03) 70%);background-size:220% 100%;animation:hfShim 2.6s linear infinite}.hf-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.hc-go{width:100%;margin-top:14px;padding:13px}.hidden{display:none!important}:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.dot{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:3000;animation:fly .8s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}@media(prefers-reduced-motion:reduce){*,::after,::before{animation-duration:NaNs!important;animation-iteration-count:1!important;transition-duration:NaNs!important}}</style></head><body data-theme="dark"><div id="hpcBar"><a id="hpc1" href="https://compstarali1.github.io/Scanner-HPC/" target="_blank" rel="noopener">-<span id="hpc1-count">…</span>X</a><a id="hpc2" href="https://compstarali1.github.io/Scanner-HPC/" target="_blank" rel="noopener">ext-<span id="hpc2-count">…</span></a></div><div class="splash" id="splash"><video id="splashVid" src="assets/logo.mp4" autoplay muted playsinline preload="auto"></video><img class="fallback" src="assets/landscape-logo.png" alt="Hyde Park Corner"><div class="skip">TAP TO SKIP</div></div><img class="hills" src="assets/hills-landscape.png" alt=""><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="toasts" id="toasts"></div><div class="container"><header><h1><img class="logo" src="assets/hpc-logo.png" alt="HPC"><span class="title-grad">HPC Job Scanner</span></h1><div class="hdr-tools"><button class="help-fab" id="helpBtn" aria-label="Help" aria-expanded="false">?</button><div class="theme" id="theme" role="button" aria-label="Toggle theme">🌙</div></div></header><label class="lbl" for="ta">Paste registrations, one per line. Add " - DONE" to mark completed.</label><div class="iw"><textarea id="ta" class="ta" placeholder="BP24FCN&#10;PJ22VHO&#10;BL24RM - DONE"></textarea><button class="paste-btn" id="pasteBtn" aria-label="Paste from clipboard">📋 PASTE</button></div><div class="keys"><button class="key k-cyan" id="addBtn"><i>➕</i>ADD</button><button class="key k-green" id="doneBtn"><i>✓</i>DONE</button><button class="key k-red" id="delBtn"><i>🗑</i>DELETE</button><button class="key k-amber" id="importBtn"><i>🖼</i>IMPORT</button><button class="key k-blue" id="moreBtn"><i>⚙</i>MORE</button></div><input type="file" id="importFile" accept="image/*" class="hidden"><div class="stats"><div class="stat cyan" id="s-found"><div class="sv" id="foundCount">0</div><div class="sl">FOUND</div></div><div class="stat amber" id="s-pend"><div class="sv" id="pendingCount">0</div><div class="sl">PENDING</div></div><div class="stat green" id="s-done"><div class="sv" id="doneCount">0</div><div class="sl">DONE</div></div><div class="stat blue" id="s-tot"><div class="sv" id="totalCount">0</div><div class="sl">TOTAL</div></div></div><div class="section"><h2 class="st">💠 Found</h2><div id="foundList" class="single"></div><div id="foundEmpty" class="empty">Tap the camera button and aim at a plate.</div></div><div class="section lists"><div><h2 class="st">⏳ Pending<button class="mini" id="selAll">SELECT ALL</button></h2><div id="col1" class="col"></div><div id="pendEmpty" class="empty hidden">Nothing pending. Paste registrations and tap ADD.</div></div><div class="divider"></div><div><h2 class="st">✅ Completed</h2><div id="completedList" class="col"></div></div></div><div class="brand"><img id="brandLogo" src="assets/landscape-logo.gif" alt="Hyde Park Corner"></div></div><div class="lb" id="lb" aria-live="polite"><div class="strip" id="strip"><video id="video" autoplay muted playsinline></video><div class="guide"></div><div class="laser"></div></div><div class="lbbar"><div class="stt" id="stt">Starting…</div><button class="zbtn" id="zoomBtn" aria-label="Zoom level">1×</button><button class="round" id="torch" aria-label="Torch">🔦</button></div></div><button class="fab" id="fab" aria-label="Open scanner"><span id="fabIcon">📷</span></button><div class="import-bar" id="importBar"><div id="importMsg">Reading screenshot…</div><div class="import-track"><div class="import-fill" id="importFill"></div></div></div><div class="modal" id="moreModal"><div class="mc"><h3>Tools</h3><div class="grid2"><div class="sep">Export list</div><button class="key k-cyan" data-exp="ALL"><i>📄</i>ALL JOBS</button><button class="key k-green" data-exp="COMPLETED"><i>✅</i>COMPLETED</button><button class="key k-amber" data-exp="REMAINING"><i>⏳</i>REMAINING</button><div class="sep">Backup</div><button class="key k-cyan" id="saveBtn"><i>💾</i>SAVE</button><button class="key k-blue" id="restoreBtn"><i>⬆</i>RESTORE</button><button class="key k-red" id="resetBtn" style="grid-column:1/-1"><i>⌫</i>RESET ALL</button></div></div></div><div class="modal" id="confirmModal" style="z-index:1500"><div class="mc"><h3 id="confirmText"></h3><div class="grid2"><button class="key wide" id="no">Cancel</button><button class="key wide k-red" id="yes">Confirm</button></div></div></div><div id="helpOverlay" aria-live="polite"></div><div class="help-ctrl" id="helpCtrl"><button class="hc hc-ghost" id="helpSkip">Skip</button><span class="hc-count" id="helpCount"></span><button class="hc" id="helpNext">Next ›</button></div><script>/* ===== state ===== */
let found=[],pending=[],completed=[],notes={},checkedItems={},fresh=new Set();
const $=id=>document.getElementById(id),ta=$('ta');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const save=()=>{try{localStorage.setItem('hpcData',JSON.stringify({found,pending,completed,notes,checkedItems}))}catch{}};
const allRegs=()=>[...found,...pending,...completed];

/* ===== helpers ===== */
const addBtnEl=$('addBtn');
function syncAddHint(){addBtnEl.classList.toggle('hint',ta.value.trim().length>0)}
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';syncAddHint()});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>{t.classList.add('bye');setTimeout(()=>t.remove(),300)},2900)}
function scanPopup(type,text,ms){
  document.querySelectorAll('.scan-pop').forEach(p=>p.remove());
  const p=document.createElement('div');p.className=`scan-pop ${type}`;p.textContent=text;p.style.setProperty('--dur',ms+'ms');
  document.body.appendChild(p);setTimeout(()=>p.remove(),ms+50)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function burst(x,y,n=16){
  if(reduce)return;const cols=['#34e7e4','#2dd4a7','#ffb347','#5b8cff','#b983ff'];
  for(let i=0;i<n;i++){const d=document.createElement('span');d.className='dot';const a=Math.random()*6.28,s=40+Math.random()*80;
    d.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--dx:${Math.cos(a)*s}px;--dy:${Math.sin(a)*s+30}px;--rot:${Math.random()*540}deg`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),850)}}
const burstAt=el=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)};
function ask(text){return new Promise(res=>{
  $('confirmText').textContent=text;$('confirmModal').classList.add('show');
  const done=v=>{$('confirmModal').classList.remove('show');$('yes').onclick=$('no').onclick=null;res(v)};
  $('yes').onclick=()=>done(true);$('no').onclick=()=>done(false)})}
function leave(regs,cb){let any=false;regs.forEach(r=>document.querySelectorAll(`[data-reg="${r}"]`).forEach(e=>{e.classList.add('out');any=true}));setTimeout(cb,any&&!reduce?240:0)}

/* key ripple + the single 3D tilt effect */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.key');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/2,d=document.createElement('span');d.className='rip';
  d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),600)});
document.addEventListener('pointermove',e=>{const b=e.target.closest('.key');if(!b||e.pointerType==='touch')return;
  const r=b.getBoundingClientRect();b.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*16+'deg');b.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*16+'deg')});
document.addEventListener('pointerout',e=>{const b=e.target.closest('.key');if(b){b.style.setProperty('--rx','0deg');b.style.setProperty('--ry','0deg')}});

/* ===== stats ===== */
const shown={};
function countTo(id,v){const el=$(id),from=shown[id]??0;shown[id]=v;if(from===v){el.textContent=v;return}
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');if(reduce){el.textContent=v;return}
  const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/500);el.textContent=Math.round(from+(v-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)}
function updateStats(){
  const tot=allRegs().length;
  countTo('foundCount',found.length);countTo('pendingCount',pending.length);countTo('doneCount',completed.length);countTo('totalCount',tot);
  [['s-found',found],['s-pend',pending],['s-done',completed]].forEach(([i,a])=>$(i).style.setProperty('--p',tot?a.length/tot:0));
  $('s-tot').style.setProperty('--p',tot?1:0)}

/* ===== cards ===== */
function card(reg,type){
  const on=!!checkedItems[reg],d=document.createElement('div');
  d.className=`reg-card ${type==='found'?'found':''} ${type==='completed'?'completed':''} ${type==='pending'&&on?'checked':''} ${fresh.has(reg)?'pop':''}`;
  d.dataset.reg=reg;d.dataset.type=type;
  const del='<button class="x" data-act="del" aria-label="Remove">×</button>';
  if(type==='pending')d.innerHTML=`<input type="checkbox" class="chk" data-act="check" ${on?'checked':''} aria-label="Select ${reg}"><span class="reg-text">${reg}</span><div class="ra">${on?'<button class="ab cb" data-act="complete">✓ COMPLETE</button>':''}${del}</div>`;
  else if(type==='found')d.innerHTML=`<input type="checkbox" class="chk" checked disabled><span class="reg-text">${reg}</span><div class="ra"><button class="ab cb" data-act="complete">✓ COMPLETE</button>${del}</div>`;
  else d.innerHTML=`<input type="checkbox" class="chk" checked disabled><span class="reg-text">${reg}</span><div class="ra"><button class="ab rb" data-act="restore" aria-label="Restore">↩ RESTORE</button>${del}</div>`;
  return d}
function render(){
  ['foundList','col1','completedList'].forEach(i=>$(i).innerHTML='');
  found.forEach(r=>$('foundList').appendChild(card(r,'found')));
  pending.forEach(r=>$('col1').appendChild(card(r,'pending')));
  completed.forEach(r=>$('completedList').appendChild(card(r,'completed')));
  $('foundEmpty').classList.toggle('hidden',found.length>0);
  $('pendEmpty').classList.toggle('hidden',pending.length>0);
  $('selAll').classList.toggle('hidden',!pending.length);
  fresh.clear();updateStats();save()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const c=b.closest('.reg-card'),reg=c.dataset.reg,type=c.dataset.type,act=b.dataset.act;
  if(act==='check'){checkedItems[reg]=b.checked;render()}
  if(act==='complete'){burstAt(c);markDone([reg])}
  if(act==='restore')restore(reg);
  if(act==='del')removeOne(reg);});
function markDone(regs){leave(regs,()=>{regs.forEach(r=>{pending=pending.filter(p=>p!==r);found=found.filter(p=>p!==r);delete checkedItems[r];if(!completed.includes(r)){completed.push(r);fresh.add(r)}});
  toast(`✅ ${regs.length>1?regs.length+' jobs':regs[0]} completed`);render()})}
function restore(reg){leave([reg],()=>{completed=completed.filter(r=>r!==reg);if(!pending.includes(reg)){pending.unshift(reg);fresh.add(reg)}toast(`↩️ ${reg} back in Pending`);render()})}
async function removeOne(reg){
  if(!await ask(`Remove ${reg}?`))return;
  leave([reg],()=>{found=found.filter(r=>r!==reg);pending=pending.filter(r=>r!==reg);completed=completed.filter(r=>r!==reg);delete checkedItems[reg];delete notes[reg];toast(`🗑️ Removed ${reg}`);render()})}

/* ===== parse & buttons ===== */
function parse(){
  if(!ta.value.trim()){shake(ta);return toast('⚠️ Paste some registrations first')}
  let a=0,d=0,s=0;
  ta.value.split(/\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const isDone=/\s*-\s*DONE$/i.test(line),m=line.replace(/\s*-\s*DONE$/i,'').match(/\b([A-Z]{1,2}[0-9]{1,2}[A-Z]{1,3}|[A-Z0-9]{5,8})\b/i);
    if(!m)return;const reg=m[1].toUpperCase();
    if(allRegs().includes(reg)){s++;return}
    fresh.add(reg);if(isDone){completed.push(reg);d++}else{pending.push(reg);a++}});
  const parts=[a&&`✅ ${a} added`,d&&`✅ ${d} completed`,s&&`⚠️ ${s} duplicate${s>1?'s':''}`].filter(Boolean);
  if(!parts.length)shake(ta);else{ta.value='';ta.style.height='auto';syncAddHint();burstAt($('addBtn'))}
  toast(parts.join(' | ')||'⚠️ No valid registrations found');render()}
$('addBtn').onclick=parse;
$('pasteBtn').onclick=async()=>{
  try{const txt=await navigator.clipboard.readText();
    if(!txt.trim())return toast('⚠️ Clipboard is empty');
    ta.value=txt;ta.dispatchEvent(new Event('input'));toast('📋 Pasted from clipboard')}
  catch{toast('⚠️ Clipboard blocked — long-press the box and paste')}};
$('doneBtn').onclick=()=>{
  const sel=[...pending,...found].filter(r=>checkedItems[r]);
  if(!sel.length){shake($('doneBtn'));return toast('⚠️ Tick pending items first')}
  burstAt($('doneBtn'));markDone(sel)};
$('delBtn').onclick=async()=>{
  const sel=pending.filter(r=>checkedItems[r]);
  if(!sel.length){shake($('delBtn'));return toast('⚠️ Tick pending items first')}
  if(await ask(`Remove ${sel.length} selected item(s)?`))leave(sel,()=>{pending=pending.filter(p=>!sel.includes(p));sel.forEach(r=>delete checkedItems[r]);toast(`🗑️ Removed ${sel.length}`);render()})};
$('selAll').onclick=()=>{const all=pending.every(r=>checkedItems[r]);pending.forEach(r=>checkedItems[r]=!all);render()};

/* ===== screenshot import (OCR) ===== */
const NOISE=new Set(['DEALER','DEALERS','HPC','ADDRESS','VEHICLE','REGISTRATION','MILEAGE','PRICE','CHECK','SCAN','JOB','JOBS','PENDING','FOUND','DONE','TOTAL','COMPLETED','REMAINING','HYDE','PARK','CORNER','LONDON','UK','ALL','DATE','TIME','NEXT','BACK','STOP','VIN','YEAR','MAKE','MODEL','COLOUR','COLOR','FUEL','PETROL','DIESEL','AUTO','MANUAL']);
const UK_PLATE=/^(?:[A-Z]{2}[0-9]{2}[A-Z]{3}|[A-Z][0-9]{1,3}[A-Z]{3}|[A-Z]{3}[0-9]{1,3}[A-Z]|[A-Z]{1,3}[0-9]{1,4})$/;
const TO_LETTER={'0':'O','1':'I','2':'Z','5':'S','8':'B','6':'G'};
const TO_DIGIT={'O':'0','Q':'0','D':'0','I':'1','L':'1','Z':'2','S':'5','B':'8','G':'6'};
function normalisePlate(raw){
  const s=raw.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.length<5||s.length>8)return null;
  if(UK_PLATE.test(s))return s;
  const pattern=['L','L','D','D','L','L','L'];
  if(s.length===7){
    const fixed=[...s].map((c,i)=>pattern[i]==='L'?(/[0-9]/.test(c)?TO_LETTER[c]||c:c):(/[A-Z]/.test(c)?TO_DIGIT[c]||c:c)).join('');
    if(UK_PLATE.test(fixed))return fixed}
  return null}
function extractRegs(text){
  const hits=new Set();
  for(const tok of text.toUpperCase().split(/[\s,;:|()\[\]{}"'`~\-_.\/\\]+/)){
    if(!tok||NOISE.has(tok)||tok.length<5||tok.length>8)continue;
    const p=normalisePlate(tok);if(p&&!NOISE.has(p))hits.add(p)}
  const joined=text.toUpperCase().replace(/([A-Z0-9]{2,4})\s+([A-Z0-9]{2,4})/g,'$1$2');
  for(const tok of joined.split(/[^A-Z0-9]+/)){
    if(tok.length<5||tok.length>8||NOISE.has(tok))continue;
    const p=normalisePlate(tok);if(p)hits.add(p)}
  return [...hits]}
function preprocess(img,mode){
  const maxW=1600,scale=Math.min(1,maxW/img.naturalWidth),w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
  const im=x.getImageData(0,0,w,h),p=im.data;let lo=255,hi=0;
  for(let i=0;i<p.length;i+=4){const g=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)|0;p[i]=g;if(g<lo)lo=g;if(g>hi)hi=g}
  const k=255/Math.max(40,hi-lo);
  for(let i=0;i<p.length;i+=4){let g=Math.max(0,Math.min(255,(p[i]-lo)*k));if(mode==='invert'){g=255-g;g=g>128?255:0}p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(im,0,0);return c}
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read image'))};i.src=u})}
function setImportProgress(msg,frac){$('importMsg').textContent=msg;$('importFill').style.width=(frac*100)+'%'}
async function importScreenshot(file){
  const bar=$('importBar');bar.classList.add('show');setImportProgress('Reading screenshot…',.05);
  try{
    if(typeof Tesseract==='undefined')throw new Error('OCR library not loaded (check internet)');
    const img=await loadImage(file),ocrRegs=new Set();
    const passes=[['contrast','Reading text…'],['invert','Checking light-on-dark…']];
    const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')setImportProgress('Reading text…',.2+m.progress*.7)}});
    await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 \n',tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});
    for(let i=0;i<passes.length;i++){
      const [mode,label]=passes[i];setImportProgress(label,.1+i*.45);
      const {data:{text}}=await worker.recognize(preprocess(img,mode));
      extractRegs(text).forEach(r=>ocrRegs.add(r))}
    await worker.terminate();
    setImportProgress('Matching against your list…',.97);
    const all=[...ocrRegs],known=new Set(allRegs()),fr=all.filter(r=>!known.has(r)),dupes=all.length-fr.length;
    bar.classList.remove('show');
    if(!fr.length)return toast(all.length?`⚠️ All ${all.length} already on your list`:'⚠️ No registrations found in screenshot');
    const existing=ta.value.trim();
    ta.value=(existing?existing+'\n':'')+fr.join('\n');ta.dispatchEvent(new Event('input'));
    burstAt($('importBtn'));
    toast(`🖼 ${fr.length} registration${fr.length>1?'s':''} imported${dupes?` | ⚠️ ${dupes} already listed`:''}`);
  }catch(e){bar.classList.remove('show');toast('⚠️ Import failed: '+(e.message||'unknown error'))}}

let ac=null,lastSnd=0,lastKey='';
function audio(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,d,type='sine',v=.22,f2){
  const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SND={
  ok(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{tone(f,i*.09,.35,'sine',.22);tone(f*2,i*.09,.25,'triangle',.05)})},
  dup(){tone(880,0,.12,'square',.1);tone(880,.18,.12,'square',.1)},
  bad(){tone(220,0,.35,'sawtooth',.16,110);tone(165,.2,.4,'sawtooth',.16,80)}};
function sound(k,key){
  const n=performance.now();
  if(k!=='ok'&&((key===lastKey&&n-lastSnd<2500)||n-lastSnd<800))return;
  lastKey=key;lastSnd=n;SND[k]();
  if(k!=='ok'&&navigator.vibrate)navigator.vibrate(k==='dup'?[40,60,40]:[120])}

/* ===== live scanner ===== */
const FIX=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[OQ]/g,'0').replace(/I/g,'1').replace(/S/g,'5').replace(/Z/g,'2').replace(/B/g,'8');
function find(list,t,maxD){
  let best=null;
  for(const r of list){const n=FIX(r),L=n.length;if(t.length<L)continue;
    for(let i=0;i<=t.length-L;i++){let d=0;for(let j=0;j<L&&d<=maxD;j++)if(t[i+j]!==n[j])d++;
      if(d<=maxD&&(!best||d<best.d))best={r,d}}}
  return best}
let stream=null,active=false,busy=false,session=0,workerP=null,hits={};
let digitalZoom=1,zoomIdx=0;const ZOOMS=[1,2,4];
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
const setStt=t=>$('stt').textContent=t;
function getWorker(){
  if(!workerP){if(typeof Tesseract==='undefined')return Promise.reject(new Error('OCR library not loaded (check internet)'));
    workerP=(async()=>{const w=await Tesseract.createWorker('eng');
      await w.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:'7'});return w})();
    workerP.catch(()=>workerP=null)}
  return workerP}
function grab(){
  const v=$('video'),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  const cw=vw/digitalZoom,ch=vh/digitalZoom,ox=(vw-cw)/2,oy=(vh-ch)/2;
  const sh=Math.min(ch,cw*84/Math.max(1,$('strip').clientWidth)),sy=oy+(ch-sh)/2;
  cv.width=560;cv.height=Math.round(560*sh/cw);cx.drawImage(v,ox,sy,cw,sh,0,0,cv.width,cv.height);
  const im=cx.getImageData(0,0,cv.width,cv.height),p=im.data;let lo=255,hi=0;
  for(let i=0;i<p.length;i+=4){const g=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)|0;p[i]=g;if(g<lo)lo=g;if(g>hi)hi=g}
  const k=255/Math.max(40,hi-lo);
  for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,(p[i]-lo)*k));p[i]=p[i+1]=p[i+2]=g}
  cx.putImageData(im,0,0);return cv}
async function loop(my){
  while(active&&my===session){
    if(!busy){busy=true;
      try{
        const c=grab();
        if(c){const w=await getWorker(),{data:{text}}=await w.recognize(c);
          if(!active||my!==session)break;
          const t=FIX(text);
          if(t.length<4){setStt('Aim at a plate…');hits={}}
          else{
            const seen=find([...found,...completed],t,1);
            const m=find(pending,t,1);
            if(seen&&(!m||seen.d<=m.d)){hits={};setStt(`${seen.r} already scanned`);sound('dup',seen.r);scanPopup('dup','Duplicate',700)}
            else if(m&&(m.d===0||(hits[m.r]=(hits[m.r]||0)+1)>=2)){await onMatch(m.r);hits={}}
            else if(m){setStt(`Checking ${m.r}…`);refocusNow()}
            else{hits={};setStt(`Not on list: ${text.trim().slice(0,14)}`);sound('bad','bad')}}}
      }catch(e){console.warn('OCR error',e);setStt('Reader error — retrying');await new Promise(r=>setTimeout(r,1500))}
      busy=false}
    await new Promise(r=>setTimeout(r,120))}}
async function onMatch(reg){
  if(found.includes(reg)||completed.includes(reg))return;
  pending=pending.filter(r=>r!==reg);delete checkedItems[reg];found.push(reg);fresh.add(reg);
  const s=$('strip');s.dataset.hit=reg;s.classList.add('hit');setStt(`${reg} matched ✓`);
  scanPopup('match','Match Found',500);
  const r=s.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,22);navigator.vibrate&&navigator.vibrate(70);sound('ok','ok');
  toast(`✅ ${reg} found`);render();
  await new Promise(r=>setTimeout(r,1100));s.classList.remove('hit');setStt('Aim at next plate…')}

/* camera, focus, zoom */
async function startStream(){
  const tries=[
    {video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},focusMode:{ideal:'continuous'}},audio:false},
    {video:{facingMode:'environment'},audio:false},
    {video:true,audio:false}];
  let err=null;
  for(const c of tries){try{return await navigator.mediaDevices.getUserMedia(c)}
    catch(e){err=e;if(e.name==='NotAllowedError'||e.name==='SecurityError')break}}
  throw err}
let focusTimer=null,lastRefocus=0;
async function refocus(track,x=.5,y=.5){
  if(!track?.applyConstraints)return;
  const modes=track.getCapabilities?.().focusMode||[];
  try{await track.applyConstraints({advanced:[{pointsOfInterest:[{x,y}]}]})}catch{}
  for(const m of ['single-shot','continuous'])if(modes.includes(m))try{await track.applyConstraints({advanced:[{focusMode:m}]})}catch{}}

async function enableAutoFocus(track){
  if(!track?.getCapabilities)return;
  clearInterval(focusTimer);focusTimer=null;
  const modes=track.getCapabilities().focusMode||[];
  await refocus(track);
  if(!modes.includes('continuous')&&modes.includes('single-shot'))
    focusTimer=setInterval(()=>{if(active&&stream)refocus(stream.getVideoTracks()[0])},3000)}
async function applyZoom(){
  const t=stream?.getVideoTracks()[0],target=ZOOMS[zoomIdx];let hw=1;const z=t?.getCapabilities?.().zoom;
  if(t&&z){hw=Math.min(z.max,Math.max(z.min,target));try{await t.applyConstraints({advanced:[{zoom:hw}]})}catch{hw=1}}
  digitalZoom=target/hw;$('video').style.transform=`scale(${digitalZoom})`;$('zoomBtn').textContent=target+'×';
  if(t)refocus(t)}
$('zoomBtn').onclick=()=>{zoomIdx=(zoomIdx+1)%ZOOMS.length;applyZoom();sound('ok','zoom')};
$('strip').addEventListener('click',e=>{
  const t=stream?.getVideoTracks()[0];if(!t)return;
  const r=$('strip').getBoundingClientRect(),
        nx=.5+((e.clientX-r.left)/r.width-.5)/digitalZoom,ny=.5+((e.clientY-r.top)/r.height-.5)/digitalZoom;
  refocus(t,Math.min(1,Math.max(0,nx)),Math.min(1,Math.max(0,ny)))});
async function openScan(){
  audio();const my=++session;active=true;
  $('lb').classList.add('show');$('fab').classList.add('open');$('fabIcon').textContent='✕';setStt('Starting camera…');
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){toast('⚠️ Camera needs a secure (HTTPS) page');return closeScan()}
  try{
    const s=await startStream();
    if(my!==session){s.getTracks().forEach(t=>t.stop());return}
    stream=s;const v=$('video');v.srcObject=s;v.muted=true;await v.play().catch(()=>{});
    enableAutoFocus(s.getVideoTracks()[0]);applyZoom();
    setStt('Loading reader…');
    getWorker().then(()=>{if(my===session){setStt('Aim at a plate…');loop(my)}}).catch(e=>{toast('⚠️ '+e.message);closeScan()})
  }catch(e){
    const why={NotAllowedError:'permission denied',SecurityError:'blocked by browser',NotFoundError:'no camera found',NotReadableError:'camera in use by another app',OverconstrainedError:'camera settings not supported'}[e.name]||e.name||'unknown error';
    toast(`⚠️ Camera: ${why}`);closeScan()}}
function closeScan(){
  active=false;session++;clearInterval(focusTimer);focusTimer=null;
  $('lb').classList.remove('show');$('fab').classList.remove('open');$('fabIcon').textContent='📷';
  $('strip').classList.remove('hit');$('torch').classList.remove('on');hits={};
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null}
$('fab').onclick=()=>active?closeScan():openScan();
$('torch').onclick=async()=>{

    tip.style.left=left+'px';tip.style.top=top+'px'}

    const c=document.createElement('div');c.className='hf-card';
    c.innerHTML=`<div class="hf-kicker">You're all set</div>
      <h3 class="hf-title">Vehicle Reg Scanner</h3>
      <p class="hf-text">Any feedback or issues please contact S.Ali at shahida@hydeparkcorner.net to improve or redesign.</p>
      <div class="hf-img"><img src="assets/hpc-logo.png" alt="HPC logo"></div>
      <button class="hc hc-go" id="hfGot">Got it</button>`;
    ov.appendChild(c);$('hfGot').onclick=close}
  function leaveAll(cb){ov.classList.add('leave');leaveT=setTimeout(()=>{ov.classList.remove('leave');ov.innerHTML='';cb()},380)}
  function advance(){if(busy||!open)return;busy=true;clearTimeout(timer);leaveAll(()=>{busy=false;showStep(idx+1)})}
  function openHelp(){
    clearTimeout(closeT);clearTimeout(leaveT);clearTimeout(timer);
    open=true;busy=false;ov.classList.remove('leave');ov.innerHTML='';ov.classList.add('show');
    btn.classList.add('on');btn.setAttribute('aria-expanded','true');showStep(0)}
  function close(){
    if(!open)return;open=false;busy=false;clearTimeout(timer);clearTimeout(leaveT);
    ov.classList.remove('show','leave');ctrl.classList.remove('show');
    btn.classList.remove('on');btn.setAttribute('aria-expanded','false');
    closeT=setTimeout(()=>{if(!open)ov.innerHTML=''},400)}
  btn.addEventListener('click',e=>{e.stopPropagation();open?close():openHelp()});
  nextBtn.addEventListener('click',()=>{if(open)advance()});
  skipBtn.addEventListener('click',close);
  addEventListener('resize',()=>{if(open&&cur)position(cur.s,cur.box,cur.tip)});
  addEventListener('scroll',()=>{if(open&&cur)position(cur.s,cur.box,cur.tip)},{passive:true});
})();</script></body></html>
